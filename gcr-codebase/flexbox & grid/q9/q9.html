<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Flip Animation</title>
  <link rel="stylesheet" href="q9.css">
</head>
<body>
  <div class="flip-wrapper">
    <div class="flip-card">
      <div class="flip-card-inner">
        <div class="flip-card-front">
          <img src="https://placehold.co/260x160" alt="Card front">
          <h2>Project Alpha</h2>
        </div>
        <div class="flip-card-back">
          <p>A short case study on redesigning an onboarding flow to cut drop-off by 30%.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
