<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Gallery - CSS Grid</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <main class="gallery">
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="Mountains">
      <figcaption>Mountain range at dawn</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="Coastline">
      <figcaption>Coastline near sunset</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="Forest">
      <figcaption>Forest trail in autumn</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="City">
      <figcaption>City skyline at night</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="Desert">
      <figcaption>Desert dunes at noon</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://placehold.co/400x300" alt="Lake">
      <figcaption>Still lake at sunrise</figcaption>
    </figure>
  </main>
</body>
</html>
