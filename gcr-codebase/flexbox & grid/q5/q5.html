<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing - Flexbox</title>
  <link rel="stylesheet" href="q5.css">
</head>
<body>
  <main class="pricing-section">
    <div class="pricing-card">
      <h2>Basic</h2>
      <p class="price">$9<span>/mo</span></p>
      <ul>
        <li>1 project</li>
        <li>Email support</li>
        <li>Basic analytics</li>
      </ul>
    </div>

    <div class="pricing-card featured">
      <h2>Pro</h2>
      <p class="price">$29<span>/mo</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>Priority support</li>
        <li>Advanced analytics</li>
      </ul>
    </div>

    <div class="pricing-card">
      <h2>Enterprise</h2>
      <p class="price">$79<span>/mo</span></p>
      <ul>
        <li>Custom integrations</li>
        <li>Dedicated manager</li>
        <li>SLA guarantee</li>
      </ul>
    </div>
  </main>
</body>
</html>
