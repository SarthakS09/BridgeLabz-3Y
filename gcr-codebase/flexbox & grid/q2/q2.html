<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Gallery - CSS Grid</title>
  <link rel="stylesheet" href="q2.css">
</head>
<body>
  <main>
    <h1 class="page-title">Product Gallery</h1>

    <section class="product-grid">
      <article class="product-card">
        <h2 class="product-name">Desk Lamp</h2>
        <p class="product-price">$24.00</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Ceramic Mug</h2>
        <p class="product-price">$12.50</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Wireless Mouse</h2>
        <p class="product-price">$18.99</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Notebook Set</h2>
        <p class="product-price">$9.00</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Backpack</h2>
        <p class="product-price">$45.00</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Water Bottle</h2>
        <p class="product-price">$15.00</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Desk Organizer with extra long name</h2>
        <p class="product-price">$21.75</p>
      </article>
      <article class="product-card">
        <h2 class="product-name">Bluetooth Speaker</h2>
        <p class="product-price">$32.40</p>
      </article>
    </section>
  </main>
</body>
</html>
