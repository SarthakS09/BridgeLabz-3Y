<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .form-box,
        .map-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .form-box,
        .map-box {
            width: 70%;
        }

        h2 {
            text-align: center;
            color: #000;
            margin-bottom: 25px;
        }

        label {
            display: inline-block;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="file"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        input[type="submit"] {
            background-color: #000;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        input[type="submit"]:hover {
            background-color: #333;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: none;
            border-radius: 10px;
        }

        .map-box h2 {
            margin-bottom: 20px;
        }

        @media screen and (max-width: 700px) {
            .form-box,
            .map-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="form-box">

            <h2>Student Registration Form</h2>

            <form action="https://example.com/submit" method="POST">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>

                <label>Gender:</label>

                <div class="radio-group">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>

                <label for="file">Upload File:</label>
                <input type="file" id="file" name="file" required>

                <label for="branch">Branch:</label>

                <select id="branch" name="branch" required>
                    <option value="">Select Branch</option>
                    <option value="cse">CSE</option>
                    <option value="ece">ECE</option>
                    <option value="mech">MECH</option>
                </select>

                <label>Select Skills:</label>

                <div class="checkbox-group">
                    <input type="checkbox" id="python" name="skills" value="python">
                    <label for="python">Python</label>

                    <input type="checkbox" id="java" name="skills" value="java">
                    <label for="java">Java</label>

                    <input type="checkbox" id="javascript" name="skills" value="javascript">
                    <label for="javascript">JavaScript</label>
                </div>

                <input type="submit" value="Register">

            </form>

        </div>
        
        <div class="map-box">

            <h2>Our Location</h2>

            <iframe
                src="https://www.google.com/maps?q=GLA%20University%20Mathura&output=embed"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

    </div>

</body>

</html>












<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
        }

        .event-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .session,
        .food {
            display: flex;
            gap: 20px;
        }

        .session label,
        .food label {
            font-weight: normal;
        }

        .session input,
        .food input {
            width: auto;
        }

        .register {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .register:hover {
            background-color: #444;
        }

        /* YouTube Section */

        .video-section {
            margin-top: 30px;
        }

        .video-section h2 {
            margin-bottom: 15px;
        }

        .video-thumbnail {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 10px;
        }

        .video-thumbnail img {
            width: 100%;
            display: block;
            border-radius: 10px;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            background-color: red;
            color: white;

            width: 70px;
            height: 50px;

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
        }

        .video-thumbnail:hover {
            opacity: 0.9;
        }

        .youtube-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .youtube-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="event-box">

            <h2>Event Registration Form</h2>

            <form>

                <label for="name">Participant Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

                <label for="event">Choose Event:</label>

                <select id="event" name="event">

                    <option value="">
                        Select Event
                    </option>

                    <option value="hackathon">
                        Hackathon
                    </option>

                    <option value="workshop">
                        Web Development Workshop
                    </option>

                    <option value="seminar">
                        Tech Seminar
                    </option>

                    <option value="quiz">
                        Technical Quiz
                    </option>

                </select>

                <label>Preferred Session:</label>

                <div class="session">

                    <label>
                        <input
                            type="radio"
                            name="session"
                            value="morning"
                        >
                        Morning
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="session"
                            value="afternoon"
                        >
                        Afternoon
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="session"
                            value="evening"
                        >
                        Evening
                    </label>

                </div>

                <label>Facilities Required:</label>

                <div class="food">

                    <label>
                        <input
                            type="checkbox"
                            name="facility"
                            value="food"
                        >
                        Food
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="facility"
                            value="certificate"
                        >
                        Certificate
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="facility"
                            value="kit"
                        >
                        Event Kit
                    </label>

                </div>

                <label for="date">Event Date:</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                >

                <label for="id">Upload ID Proof:</label>

                <input
                    type="file"
                    id="id"
                    name="id"
                >

                <button
                    type="submit"
                    class="register"
                >
                    Register Now
                </button>

            </form>


            <!-- YouTube Video Section -->

            <div class="video-section">

                <h2>Featured Video</h2>

                <a
                    href="https://youtu.be/isypb-jIDRs?si=iIaPzHf3o3Rthucs"
                    target="_blank"
                    class="video-thumbnail"
                >

                    <img
                        src="https://img.youtube.com/vi/isypb-jIDRs/maxresdefault.jpg"
                        alt="YouTube Video Thumbnail"
                    >

                    <div class="play-button">
                        ▶
                    </div>

                </a>

                <a
                    href="https://youtu.be/isypb-jIDRs?si=iIaPzHf3o3Rthucs"
                    target="_blank"
                    class="youtube-link"
                >
                    Watch Video on YouTube
                </a>

            </div>

        </div>

    </div>

</body>

</html>
