<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colored Boxes</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .yellow-rectangle {
            width: 100%;
            height: 550px;
            background-color: rgb(113, 113, 106);

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;

            gap: 20px;
            padding-left: 30px;
        }

        .box {
            width: 180px;
            height: 120px;

            border: 2px solid black;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .blue-box {
            background-color: blue;
        }

        .red-box {
            background-color: red;
        }

        .green-box {
            background-color: green;
        }

        .orange-box {
            background-color: orange;
        }
    </style>
</head>

<body>

    <div class="yellow-rectangle">

        <div class="box blue-box">
        </div>

        <div class="box red-box">
            I am fine
        </div>

        <div class="box green-box">
        </div>

        <div class="box orange-box">
            All Good
        </div>

    </div>

</body>
</html>
